[package]
name = "hlt-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
hlt-core = { path = "../hlt-core", features = ["pdf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
jsonschema = "0.18"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
