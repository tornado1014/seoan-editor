[package]
name = "hlt-core"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
crc32fast = "1"
difflib = "0.4"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
encoding_rs = "0.8"
# CCITT G4 — 이미 `tiff` 를 거쳐 의존 그래프에 있다(새 크레이트 아님).
fax = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff"] }
quick-xml = "0.41"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tempfile = "3"
zip = { version = "3", default-features = false, features = ["deflate"] }
jpeg-encoder = "0.7.1"
krilla = { version = "0.8", optional = true }

# asm 은 GNU 어셈블러라 윈도 MSVC 에서 sha2-asm 빌드가 깨진다(lib.exe 1181) — 그 밖에서만 켠다.
[target.'cfg(not(target_env = "msvc"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]

[features]
pdf = ["dep:krilla"]
